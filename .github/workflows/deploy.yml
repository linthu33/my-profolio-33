name: CI/CD Docker Compose Deploy

on:
  push:
    branches:
      - main # main branch ကို push လုပ်တိုင်း အလုပ်လုပ်မည်

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH commands to deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Project folder ထဲသို့ ဝင်ပါ (သင့် VPS ပေါ်ရှိ လမ်းကြောင်းအတိုင်း ပြင်ပါ)
            cd /home/deploy/gitrepo

            # နောက်ဆုံးရ image ကို ဆွဲယူပါ
            docker-compose pull

            # Container အဟောင်းများကို ရပ်ပြီး အသစ်ဖြင့် ပြန်လည် run ပါ
            docker-compose up -d --remove-orphans

            # အသုံးမပြုတော့သော image အဟောင်းများကို ရှင်းလင်းပါ
            docker image prune -af
